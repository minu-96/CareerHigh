<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커리어 하이 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 서류철 한 권. 폭 440px 한 단, 맨 위에 명함, 아래에 이력서 양식의 표와 결재 도장. 강조는 인주색 하나. */
:root{
  --paper:#eceeeb; --sheet:#fbfbf8; --ink:#1b2330; --muted:#667080; --rule:#c6cad0; --cell:#e9ebe7;
  --stamp:#c5301c; --good:#2c7a4b; --warn:#a8690f;
  --f-display:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171c; --sheet:#1d2128; --ink:#e8eaed; --muted:#98a1ad; --rule:#3a414c; --cell:#252a33;
    --stamp:#ff6b57; --good:#6cc48f; --warn:#e0a84a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171c; --sheet:#1d2128; --ink:#e8eaed; --muted:#98a1ad; --rule:#3a414c; --cell:#252a33;
  --stamp:#ff6b57; --good:#6cc48f; --warn:#e0a84a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:440px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:20px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* 문서 한 장 */
.sheet{background:var(--sheet);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:12px}
.doc-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.doc-head .no{font-family:var(--f-num);font-size:12px;color:var(--muted)}

/* 명함 */
.bizcard{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--ink);padding:18px 18px 16px;position:relative;min-height:132px;display:flex;flex-direction:column;gap:4px}
.bizcard .co{font-size:13px;color:var(--muted);letter-spacing:.04em}
.bizcard .nm{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.12em;line-height:1.2}
.bizcard .tt{font-size:15px;font-weight:500}
.bizcard .meta{margin-top:auto;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.nick{position:absolute;right:14px;top:14px;border:2px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-weight:700;font-size:13px;padding:2px 8px;transform:rotate(4deg);border-radius:3px}

/* 양식 표 */
table.form{width:100%;border-collapse:collapse;font-size:14px}
table.form th,table.form td{border:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
table.form th{background:var(--cell);font-weight:500;white-space:nowrap;width:1%}
.bar{height:6px;background:var(--cell);margin-top:5px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar.burn i{background:var(--warn)}
.bar.burn.hot i{background:var(--stamp)}

/* 행동력 */
.alloc{display:flex;flex-direction:column}
.alloc .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.alloc .row:last-child{border-bottom:0}
.alloc .lab b{font-weight:600}
.alloc .lab span{display:block;font-size:12.5px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border:1px solid var(--ink);background:var(--sheet);font-size:20px;line-height:1;border-radius:2px}
.step button:disabled{opacity:.3;cursor:default}
.step .v{width:26px;text-align:center;font-family:var(--f-num);font-weight:600;font-size:18px}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:8px;border:1px solid var(--ink)}
.pips i.on{background:var(--ink)}

/* 버튼 */
.btn{display:block;width:100%;padding:13px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:600;border-radius:2px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.choice{background:var(--sheet);color:var(--ink);text-align:left;font-weight:500}
.btn.choice small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:2px}
.btn.choice.locked{border-style:dashed;opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:14px}
.resign{border:1px dashed var(--stamp);color:var(--stamp);background:transparent;padding:10px;border-radius:2px;font-size:14px}

/* 결재 도장 */
.stamp{width:92px;height:92px;border:4px solid var(--stamp);border-radius:50%;color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;transform:rotate(-9deg);flex:none;animation:slam .35s cubic-bezier(.2,1.4,.4,1) both}
.stamp b{font-size:40px;line-height:1}
.stamp span{font-size:11px;letter-spacing:.1em}
@keyframes slam{from{transform:rotate(-9deg) scale(2.2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
.yr-top{display:flex;gap:14px;align-items:center}

.news{border-left:3px solid var(--stamp);padding:2px 0 2px 10px;font-size:14px}
.delta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--rule);padding:1px 7px;border-radius:999px;font-family:var(--f-num)}
.chip.up{color:var(--good);border-color:var(--good)}
.chip.dn{color:var(--stamp);border-color:var(--stamp)}
ul.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
ul.lines li{padding-left:12px;position:relative}
ul.lines li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:1px;background:var(--ink)}
.shame{color:var(--stamp)}
.gap-row td{color:var(--muted);font-style:normal}
.gap-row button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.hero-title{font-family:var(--f-display);font-weight:700;font-size:44px;letter-spacing:.06em;line-height:1.1}
.hero-title em{font-style:normal;color:var(--stamp)}
input[type=text]{font:inherit;color:inherit;background:var(--sheet);border:1px solid var(--ink);padding:10px;border-radius:2px;width:100%}
.note{font-size:12.5px;color:var(--muted)}
</style>
</head>

/* ============ 엔진 (화면과 분리) ============ */
function rnd(s){ s.seed=(s.seed+0x6D2B79F5)|0; let t=s.seed; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
function ri(s,a,b){ return a+Math.floor(rnd(s)*(b-a+1)); }
function pick(s,arr){ return arr[Math.floor(rnd(s)*arr.length)]; }
function wpick(s,arr,wf){ let tot=0; for(const x of arr) tot+=wf(x); let r=rnd(s)*tot; for(const x of arr){ r-=wf(x); if(r<0) return x; } return arr[arr.length-1]; }
function clampStats(s){ for(const k of ["skill","rep","net","burn"]) s.stats[k]=Math.max(0,Math.min(100,Math.round(s.stats[k]))); s.stats.money=Math.round(s.stats.money); if(s.stats.burn>s.maxBurn) s.maxBurn=s.stats.burn; }
function has(s,t){ return s.traits.indexOf(t)>=0; }
function job(s){ return JOBS[s.job]; }
function titleOf(s){
  if(s.track==="school") return (s.edu==="univ"||s.edu==="college")?"대학생":"고등학생";
  if(s.track==="rest") return s.everJoined?"구직 중":"취업 준비생";
  return (s.track==="founder"?job(s).ftitles:job(s).titles)[s.stage];
}
function orgOf(s){
  if(s.track==="school") return EDU[s.edu];
  if(s.track==="rest") return "소속 없음";
  return s.company;
}
function logAdd(s,text,shame){ s.log.push({age:s.age,text:text,shame:!!shame}); }
function resumeAdd(s,text){ s.resume.push({age:s.age,text:text}); }
function cardIssue(s){ const c={age:s.age,title:titleOf(s),org:orgOf(s)}; const l=s.cards[s.cards.length-1]; if(!l||l.title!==c.title||l.org!==c.org) s.cards.push(c); }

function newRun(seed,name){
  const s={v:1,seed:seed|0,name:"",age:17,origin:"",edu:"",traits:[],job:"",track:"school",stage:0,pp:0,
    stats:{skill:10,rep:10,net:10,burn:0,money:0},salary:0,company:"",companyMult:1,boss:"",rival:null,nickname:"",
    flags:{},counters:{work:0,study:0,network:0,rest:0,total:0,jobChanges:0,yearsAtStage:0,maxStay:0,rejections:0,founded:0},
    resume:[],log:[],cards:[],seen:{},era:null,eraLeft:0,eraWait:0,gradAge:20,everJoined:false,careerStage:1,prevCareerStage:1,
    maxBurn:0,maxStage:0,bestTitle:"",yearPerf:0,slots:4,phase:"draw",queue:[],current:null,result:null,summary:null,lastAlloc:null,
    leaveNext:false,onLeave:false,ending:null,news:"",firstCompany:""};
  s.name=name||pick(s,SURNAMES)+pick(s,GIVEN);
  s.age=ri(s,17,20);
  const o=wpick(s,ORIGINS,x=>x.w); s.origin=o.id;
  if(s.age<20){ s.edu=wpick(s,["gen","voc"],k=>o.hs[k]); s.gradAge=20; }
  else{
    const e=wpick(s,["univ","college","work"],k=>o.edu[k]);
    if(e==="univ"){ s.edu="univ"; s.gradAge=24; }
    else if(e==="college"){ s.edu="college"; s.gradAge=22; }
    else{ s.edu=wpick(s,["gen","voc"],k=>o.hs[k]); s.track="rest"; }
  }
  s.traits=[pick(s,TRAITS_GOOD).id,pick(s,TRAITS_BAD).id];
  const ids=Object.keys(JOBS);
  s.job=rnd(s)<0.1?pick(s,ids):wpick(s,ids,k=>JOBS[k].eduW[s.edu]);
  for(const k in o.fx) s.stats[k]+=o.fx[k];
  s.eraWait=ri(s,3,6);
  if(s.track==="school"){
    if(s.edu==="univ"||s.edu==="college") resumeAdd(s,EDU[s.edu]+" 입학"); else resumeAdd(s,EDU[s.edu]+" 재학");
  } else resumeAdd(s,EDU[s.edu]+" 졸업");
  clampStats(s); cardIssue(s);
  return s;
}
function origin(s){ return ORIGINS.find(o=>o.id===s.origin); }
function addBurn(s,x,fromCard){
  if(x>0){ if(s.origin==="working") x*=0.9; if(fromCard&&has(s,"glass")) x*=1.5; }
  else if(!fromCard&&has(s,"workaholic")) x*=0.7;
  s.stats.burn+=x;
}
function addSkill(s,x){ if(x>0){ if(has(s,"hands")) x*=1.25; if(s.origin==="poor") x*=1.1; } s.stats.skill+=x; }

function beginYear(s){
  s.yearPerf=0; s.result=null; s.summary=null; s.queue=[]; s.current=null; s.news="";
  if(s.eraLeft>0){ s.eraLeft--; if(s.eraLeft===0) s.era=null; }
  if(!s.era){ s.eraWait--; if(s.eraWait<=0){ const e=pick(s,ERAS); s.era=e.id; s.eraLeft=2; s.eraWait=ri(s,4,7); s.news=e.text; logAdd(s,"뉴스: "+e.text); } }
  s.onLeave=false;
  if(s.leaveNext){ s.leaveNext=false; s.onLeave=true; s.slots=0; }
  else s.slots=s.stats.burn>=RULES.burnSlotCut?3:RULES.slots;
  s.phase="alloc";
}
function actionsOf(s){ return ACTIONS[s.track].filter(a=>a[0]!=="invest"||s.age>=30); }

function commitAlloc(s,alloc){
  s.lastAlloc=Object.assign({},alloc);
  const sk=s.stats.skill, n=k=>alloc[k]||0;
  if(s.onLeave){ addBurn(s,-10,true); logAdd(s,"병가로 한 해를 쉬었다"); }
  for(let i=0;i<n("work");i++){
    s.yearPerf+=10*(0.5+sk/100);
    let b=8; if(has(s,"steel")) b*=0.75; if(s.track==="career"&&s.boss==="overtime") b+=2; addBurn(s,b);
  }
  for(let i=0;i<n("study");i++){ addSkill(s,s.stats.skill>=70?2:4); addBurn(s,3); }
  for(let i=0;i<n("network");i++){ s.stats.net+=5*(has(s,"talk")?1.5:1); s.stats.rep+=1; s.stats.money-=100; }
  for(let i=0;i<n("club");i++){ s.stats.net+=4*(has(s,"talk")?1.5:1); s.stats.rep+=2; addBurn(s,2); }
  for(let i=0;i<n("part");i++){ s.stats.money+=300; s.stats.net+=1; addBurn(s,5); }
  for(let i=0;i<n("rest");i++) addBurn(s,-15);
  for(let i=0;i<n("invest");i++){
    let r=rnd(s); if(has(s,"gullible")) r-=0.15; if(has(s,"lucky")) r+=0.07;
    const d=r<0.4?-350:r<0.8?400:r<0.95?1200:3000; s.stats.money+=d;
    logAdd(s,d>0?"투자 수익 "+d+"만 원":"투자 손실 "+(-d)+"만 원",d<0);
  }
  if(s.track==="career"||s.track==="founder"){ const c=s.counters; c.work+=n("work"); c.study+=n("study"); c.network+=n("network"); c.rest+=n("rest"); c.total+=s.slots; }
  clampStats(s);
  buildQueue(s);
  nextEvent(s);
}
function matches(s,w){
  if(!w) return true;
  if(w.track){ const t=[].concat(w.track); if(t.indexOf(s.track)<0) return false; }
  if(w.job&&w.job!==s.job) return false;
  if(w.job&&s.track!=="career"&&s.track!=="founder") return false;
  if(w.stage&&(s.stage<w.stage[0]||s.stage>w.stage[1])) return false;
  if(w.age&&(s.age<w.age[0]||s.age>w.age[1])) return false;
  if(w.origin&&w.origin!==s.origin) return false;
  if(w.flag&&!s.flags[w.flag]) return false;
  if(w.noflag&&s.flags[w.noflag]) return false;
  if(w.hasRival&&!s.rival) return false;
  if(w.rivalLike!=null&&(!s.rival||s.rival.like<w.rivalLike||s.rival.status!=="same")) return false;
  if(w.min) for(const k in w.min) if(s.stats[k]<w.min[k]) return false;
  return true;
}
function cardById(id){ return CARDS.find(c=>c.id===id); }
function buildQueue(s){
  const q=[];
  if(s.onLeave){ s.queue=q; return; }
  if(s.track==="school"&&s.age===s.gradAge-1) q.push(s.edu==="gen"||s.edu==="voc"?"after_high":"job_apply");
  if(s.track==="rest") q.push("job_apply");
  if((s.track==="career"||s.track==="founder")&&s.stage===5&&promoReady(s)) q.push("peak_review");
  const pool=CARDS.filter(c=>!c.required&&matches(s,c.when)&&!(c.once&&s.seen[c.id]!=null)&&!(s.seen[c.id]!=null&&s.age-s.seen[c.id]<8));
  const r=rnd(s); let cnt=r<0.3?0:r<0.8?1:2; if(s.track==="school"||s.track==="rest") cnt=Math.min(cnt,1);
  for(let i=0;i<cnt&&pool.length;i++){ const c=wpick(s,pool,x=>x.w||5); pool.splice(pool.indexOf(c),1); q.push(c.id); }
  s.queue=q;
}
function nextEvent(s){
  if(s.ending){ finish(s); s.phase="ending"; return; }
  if(s.queue.length){ s.current=s.queue.shift(); s.result=null; s.phase="event"; }
  else yearEnd(s);
}
function fill(s,t){
  return String(t).replace(/\{rival\}/g,s.rival?s.rival.name:"동기").replace(/\{jobname\}/g,job(s).name)
    .replace(/\{peak\}/g,job(s).peak).replace(/\{bossname\}/g,s.boss?BOSSES[s.boss].name:"").replace(/\{company\}/g,s.company).replace(/\{cost\}/g,won(job(s).cost));
}
function choiceChance(s,ch){
  if(ch.chance==null) return null;
  let p=ch.chance;
  if(ch.chanceFn==="apply"){ p=30+(s.stats.skill-25)*1.2+job(s).eduBonus[s.edu]+s.stats.net/5+(s.everJoined?s.careerStage*8:0); if(s.era==="recession") p-=12; if(s.era==="boom") p+=10; }
  else if(ch.chanceStat) p+=(s.stats[ch.chanceStat]-50)*0.5;
  if(has(s,"lucky")) p+=10;
  return Math.max(5,Math.min(95,Math.round(p)));
}
function visibleChoices(s,card){ return card.choices.map((c,i)=>({c:c,i:i})).filter(x=>matches(s,x.c.when)); }
function locked(s,ch){ if(!ch.require) return false; for(const k in ch.require) if(s.stats[k]<ch.require[k]) return true; return false; }

function choose(s,idx){
  const card=cardById(s.current), ch=card.choices[idx];
  if(!ch||locked(s,ch)||!matches(s,ch.when)) return;
  const before=Object.assign({},s.stats), ppB=s.pp;
  if(!card.required||card.id==="resign") s.seen[card.id]=s.age;
  let text=ch.result||"", shame=ch.shame||null;
  applyFx(s,ch.effects);
  let branch=null;
  if(ch.check) branch=s.stats[ch.check.stat]>=ch.check.min?ch.success:ch.fail;
  else if(ch.chance!=null) branch=rnd(s)*100<choiceChance(s,ch)?ch.success:ch.fail;
  if(branch){ applyFx(s,branch.effects); text=branch.result; shame=branch.shame||null; }
  if(s.pendingText){ text=s.pendingText; s.pendingText=null; }
  if(s.pendingShame){ shame=s.pendingShame; s.pendingShame=null; }
  clampStats(s);
  text=fill(s,text);
  const delta={}; for(const k in before) if(s.stats[k]!==before[k]) delta[k]=s.stats[k]-before[k];
  if(s.pp!==ppB) delta.pp=s.pp-ppB;
  logAdd(s,fill(s,card.title)+": "+fill(s,ch.text)+". "+text,false);
  if(shame) logAdd(s,fill(s,shame),true);
  s.result={title:fill(s,card.title),text:text,delta:delta,shame:shame?fill(s,shame):null};
  s.phase="result";
}
function applyFx(s,fx){
  if(!fx) return;
  for(const k in fx){
    const v=fx[k];
    if(k==="skill") addSkill(s,v);
    else if(k==="burn") addBurn(s,v,true);
    else if(k==="rep"||k==="net"||k==="money") s.stats[k]+=v;
    else if(k==="perf") s.yearPerf+=v;
    else if(k==="pp") s.pp=Math.max(0,s.pp+v);
    else if(k==="salaryPct") s.salary=Math.round(s.salary*(1+v/100));
    else if(k==="like"){ if(s.rival) s.rival.like=Math.max(0,Math.min(5,s.rival.like+v)); }
    else if(k==="flag") s.flags[v]=true;
    else if(k==="resume") resumeAdd(s,v);
    else if(k==="do") doAct(s,v);
  }
}
function makeBoss(s){ s.boss=pick(s,Object.keys(BOSSES)); }
function join(s,tier){
  const j=job(s);
  if(s.track==="school") resumeAdd(s,EDU[s.edu]+" 졸업");
  const stage=s.everJoined?Math.max(1,Math.min(5,s.careerStage)):1;
  if(s.everJoined) s.counters.jobChanges++;
  let c=pick(s,tier==="big"?j.big:j.small); if(c===s.company) c=pick(s,tier==="big"?j.big:j.small);
  s.company=c; s.companyMult=tier==="big"?1.2:0.9; s.track="career"; s.stage=stage; s.pp=0; s.counters.yearsAtStage=0;
  s.salary=Math.round(RULES.salary[stage]*j.rate*s.companyMult);
  makeBoss(s);
  if(!s.everJoined){ s.everJoined=true; s.firstCompany=c; s.rival={name:pick(s,SURNAMES)+pick(s,GIVEN),stage:1,pp:0,like:3,status:"same"}; if(s.rival.name===s.name) s.rival.name=pick(s,SURNAMES)+pick(s,GIVEN); }
  else if(s.rival&&s.rival.status==="same") s.rival.status="other";
  resumeAdd(s,c+" 입사 ("+j.titles[stage]+")"); cardIssue(s);
}
function found(s,startStage,free,label){
  const j=job(s);
  if(s.track==="career"){ s.prevCareerStage=s.stage; s.careerStage=s.stage; }
  if(!free) s.stats.money-=j.cost;
  s.track="founder"; s.stage=startStage; s.pp=0; s.counters.yearsAtStage=0; s.counters.founded++; s.boss=""; s.salary=0;
  s.company=label||(s.name.slice(1)+pick(s,j.mine)); s.companyMult=1; s.flags.founder=true;
  if(s.rival&&s.rival.status==="same") s.rival.status="other";
  resumeAdd(s,s.company+" 창업"); cardIssue(s);
}
function doAct(s,a){
  const j=job(s);
  if(a==="go_univ"){ s.edu="univ"; s.gradAge=s.age+5; resumeAdd(s,"4년제 대학 합격"); }
  else if(a==="go_college"){ s.edu="college"; s.gradAge=s.age+3; resumeAdd(s,"전문대 합격"); }
  else if(a==="go_work"){ s.queue.unshift("job_apply"); }
  else if(a==="join_big") join(s,"big");
  else if(a==="join_small") join(s,"small");
  else if(a==="apply_fail"){ if(s.track==="school") resumeAdd(s,EDU[s.edu]+" 졸업"); s.track="rest"; s.counters.rejections++; cardIssue(s); }
  else if(a==="switch_job"){ const others=Object.keys(JOBS).filter(k=>k!==s.job); s.job=pick(s,others); if(s.everJoined) s.careerStage=Math.max(1,s.careerStage-1); s.stats.skill*=s.everJoined?0.6:1; join(s,"small"); s.pendingText="계획에 없던 길이다. "+JOBS[s.job].name+" 분야에서 다시 시작한다."; }
  else if(a==="fri_refuse"){ if(s.boss==="overtime"){ s.stats.rep-=4; s.pendingText="월요일 아침, 상사의 표정이 보고서보다 먼저 왔다."; } else s.pendingText="월요일에 해도 아무 일 없었다."; }
  else if(a==="move"){ s.counters.jobChanges++; let c=pick(s,j.big); if(c===s.company) c=pick(s,j.small); s.company=c; s.companyMult=1.2; s.salary=Math.round(s.salary*1.2); makeBoss(s); s.counters.yearsAtStage=0; if(s.rival&&s.rival.status==="same") s.rival.status="other"; resumeAdd(s,c+" 이직 ("+j.titles[s.stage]+")"); cardIssue(s); }
  else if(a==="reboss"){ const old=s.boss; makeBoss(s); if(s.boss===old) makeBoss(s); }
  else if(a==="quit_move"){ s.careerStage=s.stage; s.track="rest"; s.salary=0; s.boss=""; logAdd(s,s.company+"에 사직서를 냈다"); cardIssue(s); }
  else if(a==="found") found(s,1,false);

  else if(a==="found_family") found(s,2,true,"부모님 가게");

  else if(a==="pay_small") s.stats.money-=Math.round(RULES.profitUnit[s.stage]*0.06);

  else if(a==="sell"){ s.stats.money+=RULES.profitUnit[s.stage]*4; resumeAdd(s,s.company+" 매각"); s.track="career"; s.stage=5; s.pp=0; s.company=pick(s,j.big); s.companyMult=1.2; s.salary=Math.round(RULES.salary[5]*j.rate*1.2); makeBoss(s); s.counters.yearsAtStage=0; resumeAdd(s,s.company+" 합류 ("+j.titles[5]+")"); cardIssue(s); }
  else if(a==="peak"){ s.stage=6; s.maxStage=6; s.flags.peak=true; s.peakAge=s.age; s.pp=0; if(s.track==="career") s.salary=Math.round(RULES.salary[6]*j.rate*s.companyMult); resumeAdd(s,titleOf(s)+" 취임"); cardIssue(s); s.queue.unshift("peak_choice"); }

function promoReady(s){ const p=RULES.promo[s.stage]; if(!p||s.pp<p.pp) return false; for(const k in p.min) if(s.stats[k]<p.min[k]) return false; return true; }
function promoLack(s){ const p=RULES.promo[s.stage]; const l=[]; if(!p) return l; for(const k in p.min) if(s.stats[k]<p.min[k]) l.push(STAT[k]+" "+p.min[k]); return l; }
function eraMult(s){ if(!s.era) return 1; return ERAS.find(e=>e.id===s.era).perf[s.job]; }
function won(n){ const a=Math.abs(n), sign=n<0?"-":""; if(a>=10000){ const e=Math.floor(a/10000), m=a%10000; return sign+e+"억"+(m?" "+m.toLocaleString("ko-KR")+"만":"")+" 원"; } return sign+a.toLocaleString("ko-KR")+"만 원"; }

function yearEnd(s){
  const sum={grade:null,lines:[],promo:null,nick:null};
  const j=job(s);
  if(has(s,"sleepy")&&(s.track==="career")&&rnd(s)<0.2){ s.yearPerf-=4; logAdd(s,"중요한 회의 날 지각했다",true); sum.lines.push("중요한 회의 날 지각했다."); }
  if(has(s,"blunt")&&(s.track==="career")&&rnd(s)<0.15){ s.stats.rep-=3; logAdd(s,"회의에서 할 말을 다 해 버렸다",true); sum.lines.push("회의에서 할 말을 다 해 버렸다. 평판 -3"); }
  if(has(s,"softie")&&(s.track==="career")&&rnd(s)<0.15){ s.yearPerf-=3; s.stats.net+=2; sum.lines.push("옆 팀 일을 떠맡았다. 고맙다는 말은 들었다."); }
  if(s.track==="career"&&!s.onLeave){
    let perf=s.yearPerf*(s.boss==="credit"?0.85:s.boss==="overtime"?1.1:1)*eraMult(s)+s.stats.rep/10;
    perf=Math.round(perf);
    const g=RULES.grade.find(x=>perf>=x[1]);
    sum.grade=g[0]; sum.perf=perf;
    if(s.stage<6){ s.pp+=g[2]; }
    if(s.era!=="recession") s.salary=Math.round(s.salary*(1+g[3]/100));
    s.stats.money+=Math.round(s.salary*0.3);
    sum.lines.push("연봉 "+won(s.salary)+" · 저축 "+won(Math.round(s.salary*0.3)));
    if(s.boss==="mentor") addSkill(s,2);
    if(g[0]==="D"){ s.flags.dstreak=(s.flags.dstreak||0)+1; if(s.flags.dstreak>=2&&s.stage<6){ s.flags.dstreak=0; s.careerStage=s.stage; s.track="rest"; s.salary=0; s.boss=""; logAdd(s,"2년 연속 D. 권고사직을 받았다",true); sum.lines.push("2년 연속 D. 권고사직 통보를 받았다."); cardIssue(s); } } else s.flags.dstreak=0;
    logAdd(s,"인사평가 "+g[0]+" (성과 "+perf+")");
  } else if(s.track==="founder"&&!s.onLeave){
    let perf=Math.round(s.yearPerf*eraMult(s)+s.stats.rep/10);
    const g=RULES.grade.find(x=>perf>=x[1]);
    sum.grade=g[0]; sum.perf=perf;
    if(s.stage<6) s.pp+=g[2];
    const profit=Math.round(RULES.profitUnit[s.stage]*(perf-20)/20*(s.flags.with_rival?1.15:1));
    s.stats.money+=profit;
    sum.lines.push(profit>=0?"올해 순이익 "+won(profit):"올해 적자 "+won(-profit));
    logAdd(s,"결산 "+g[0]+" · "+(profit>=0?"순이익 ":"적자 ")+won(Math.abs(profit)),profit<0);
  } else if(s.onLeave){ sum.lines.push("병가로 한 해를 쉬었다."); if(s.track==="career") s.stats.money+=Math.round(s.salary*0.15); }
  if(has(s,"thrift")&&s.stats.money>0) s.stats.money+=Math.min(500,Math.round(s.stats.money*0.05));
  clampStats(s);
  /* 번아웃: 자연 회복보다 먼저 판정한다 */
  if(s.stats.burn>=100){
    if(s.flags.burnout_once){ s.ending="burnout"; }
    else{ s.flags.burnout_once=true; s.leaveNext=true; s.stats.burn=40; logAdd(s,"쓰러졌다. 응급실 천장을 봤다",true); sum.lines.push("쓰러졌다. 내년은 통째로 쉰다. 다음에 또 쓰러지면 돌아오지 못한다."); }
  }
  if(s.stats.burn<100) s.stats.burn-=5;
  clampStats(s);
  /* 승진 */
  if((s.track==="career"||s.track==="founder")&&s.stage>=1&&s.stage<=4){
    if(promoReady(s)){ s.stage++; s.pp=0; s.counters.yearsAtStage=-1;
      if(s.track==="career") s.salary=Math.max(Math.round(s.salary*1.1),Math.round(RULES.salary[s.stage]*j.rate*s.companyMult));
      sum.promo=titleOf(s); resumeAdd(s,(s.track==="career"?titleOf(s)+" 승진":"회사 성장: "+titleOf(s))); logAdd(s,titleOf(s)+" 승진"); cardIssue(s);
    } else if(s.pp>=RULES.promo[s.stage].pp){ sum.lines.push("승진 점수는 찼다. 부족한 것: "+promoLack(s).join(", ")); }
  } else if(s.stage===5&&(s.track==="career"||s.track==="founder")){
    if(promoReady(s)) sum.lines.push("내년에 정점 심사가 열린다.");
    else if(s.pp>=20) sum.lines.push("정점 심사에 부족한 것: "+promoLack(s).join(", "));
  }
  if(s.track==="career"||s.track==="founder"){ s.counters.yearsAtStage++; if(s.stage===3&&s.track==="career"&&s.counters.yearsAtStage>s.counters.maxStay) s.counters.maxStay=s.counters.yearsAtStage; if(s.stage>s.maxStage||!s.bestTitle){ s.maxStage=s.stage; s.bestTitle=titleOf(s); } else if(s.stage===s.maxStage) s.bestTitle=titleOf(s); }
  /* 창업 실패 */
  if(s.track==="founder"&&s.stats.money<-Math.max(5000,RULES.profitUnit[s.stage])){
    if(s.flags.closed_once){ s.ending="bankrupt"; }
    else{ s.flags.closed_once=true; logAdd(s,s.company+" 폐업. 간판을 직접 내렸다",true); resumeAdd(s,s.company+" 정리"); sum.lines.push(s.company+" 폐업. 빚을 정리하고 다시 구직한다. 재기는 한 번뿐이다.");
      s.track="rest"; s.stage=0; s.stats.money=-1000; s.careerStage=Math.max(1,s.prevCareerStage||1); cardIssue(s); }
  }
  if(s.track!=="founder"&&s.stats.money<-10000) s.ending="bankrupt";
  /* 동기 */
  if(s.rival){
    const r=s.rival, need=[0,4,8,12,16,20][r.stage]; r.pp+=ri(s,1,3);
    if(r.stage<5&&r.pp>=need){ r.stage++; r.pp=0;
      const t=r.status==="founder"?JOBS[s.job].ftitles[r.stage]:JOBS[s.job].titles[r.stage];
      sum.lines.push("동기 "+r.name+": "+t+" 승진"+(s.track==="career"&&r.stage>s.stage?". 나보다 빠르다.":"."));
    } else if(rnd(s)<0.35){
      sum.lines.push("동기 "+r.name+": "+pick(s,["프로필 사진이 골프장으로 바뀌었다.","단체방에 야근 사진을 올렸다.","결혼식 사회를 봐 달라고 한다.","\"요즘 어때?\" 다섯 글자가 왔다.","이직했다는 소문이 돈다.","점심 먹자더니 자기 회사 얘기만 했다."]));
    }
  }
  /* 별명 */
  const nk=calcNick(s); if(nk&&nk!==s.nickname){ s.nickname=nk; sum.nick=nk; logAdd(s,"별명이 생겼다: "+nk); }
  if(s.flags.peak&&s.stage===6&&!s.ending) sum.lines.push("정상의 자리에서 한 해를 더 보냈다.");
  clampStats(s);
  s.summary=sum; s.phase=s.ending?"ending":"yearend";
  if(s.ending) finish(s);
}
function calcNick(s){
  const c=s.counters; if(c.total<16) return s.nickname;
  if(c.jobChanges>=3) return "프로 이직러";
  if(s.track==="career"&&c.yearsAtStage>=10&&s.stage<5) return "만년 "+titleOf(s);
  if(c.work/c.total>=0.62) return "야근 요정";
  if(c.rest/c.total>=0.33) return "칼퇴의 신";
  if(c.network/c.total>=0.3) return "회식 에이스";
  if(c.study/c.total>=0.33) return "자기계발 중독";
  return s.nickname;
}
function advance(s){
  if(s.ending){ s.phase="ending"; return; }
  s.age++;
  if(s.age>=RULES.retireAge){ s.ending=s.flags.peak&&s.stage===6?"clear65":"retire"; finish(s); s.phase="ending"; return; }
  beginYear(s);
}
function finish(s){
  if(s.final) return;
  const j=job(s), f={kind:s.ending,title:"",scene:"",verdict:"",hidden:null};
  if(s.ending==="clear"||s.ending==="clear65"){
    f.title=j.peak+", 정점에 서다";
    f.scene=s.ending==="clear"?"퇴임식장은 조용했다. 꽃다발은 생각보다 무거웠다.":"65세, 마지막 출근. 회장실 화분은 후임에게 물려줬다.";
    f.verdict=s.peakAge+"세에 "+j.peak+" 자리에 올랐다.";
  } else if(s.ending==="burnout"){ f.title="조기 은퇴"; f.scene="두 번째로 쓰러진 날, 의사는 차트를 덮었다. \"이제 그만하셔야 합니다.\""; f.verdict=s.age+"세, 몸이 먼저 사표를 냈다."; }
  else if(s.ending==="bankrupt"){ f.title="파산"; f.scene="법원 복도는 길었다. 서류에 도장을 찍는 데는 10초가 걸렸다."; f.verdict=s.age+"세, 숫자가 나를 이겼다."; }
  else{
    f.title="정년 퇴임"; f.scene="65세, 마지막 출근. 책상 서랍에서 20년 된 볼펜이 나왔다.";
    const st=s.track==="career"||s.track==="founder"?s.stage:0;
    f.verdict=s.track==="founder"?(st>=4?"회사를 꽤 크게 키운 대표.":st>=2?"작지만 단단한 회사의 대표.":"끝까지 혼자 가게를 지킨 사장.")
      :s.track==="career"?(st>=5?"정상 바로 아래에서 멈춘 사람.":st>=3?"회사를 실제로 굴린 허리.":"제자리를 끝까지 지킨 사람.")
      :"마지막 명함에는 소속이 없었다.";
  }
  const c=s.counters;
  if(s.ending==="clear"||s.ending==="clear65"){
    if(s.flags.closed_once&&s.track==="founder") f.hidden="오뚝이";
    else if(s.peakAge<45) f.hidden="최연소";
    else if(s.flags.with_rival&&s.rival&&s.rival.status==="partner") f.hidden="동기 사랑";

  }

}

      ["지망",`${job(S).name}<div class="small muted">목표: ${job(S).peak}</div>`]];
    return `<div class="sheet"><div class="doc-head"><h2>통지서</h2><span class="no">${drawStep+1} / ${rows.length}</span></div>
      <p><b>${esc(S.name)}</b> 님의 출발점을 알려 드립니다. 이의 신청은 받지 않습니다.</p>
      <table class="form">${rows.slice(0,drawStep+1).map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table>
      ${drawStep<rows.length-1?`<button class="btn" data-act="draw-next">다음 장</button>`:`<button class="btn" data-act="draw-done">이대로 시작한다</button>`}</div>`;
  }
  function vAlloc(){
    const acts=actionsOf(S); let used=0; for(const a of acts) used+=draft[a[0]]||0;
    const left=S.slots-used;
    const same=S.lastAlloc&&Object.keys(S.lastAlloc).reduce((n,k)=>n+S.lastAlloc[k],0)===S.slots&&Object.keys(S.lastAlloc).every(k=>!S.lastAlloc[k]||acts.some(a=>a[0]===k))&&(!S.lastAlloc.invest||S.stats.money>=500*S.lastAlloc.invest);
    return `${bizcard(S)}
      ${S.news?`<div class="news">${esc(S.news)}</div>`:S.era?`<div class="news muted">${esc(ERAS.find(e=>e.id===S.era).text)}</div>`:""}
      <div class="sheet">${statsTable(S)}</div>
      <div class="sheet"><div class="doc-head"><h2>${S.age}세의 계획</h2><span class="pips">${Array.from({length:S.slots},(_,i)=>`<i class="${i<used?"on":""}"></i>`).join("")}</span></div>
      ${S.onLeave?`<p>병가 중이다. 올해는 아무것도 하지 않는다.</p>`:`
      ${S.slots<RULES.slots?`<p class="small shame">번아웃 70 이상. 올해는 행동력이 ${S.slots}칸뿐이다.</p>`:""}
      <div class="alloc">${acts.map(a=>{ const v=draft[a[0]]||0, cant=a[0]==="invest"&&S.stats.money<500*(v+1);
        return `<div class="row"><div class="lab"><b>${a[1]}</b><span>${a[2]}</span></div><div class="step">
        <button data-act="dec" data-k="${a[0]}" ${v<=0?"disabled":""} aria-label="${a[1]} 줄이기">−</button><span class="v">${v}</span>
        <button data-act="inc" data-k="${a[0]}" ${left<=0||cant?"disabled":""} aria-label="${a[1]} 늘리기">+</button></div></div>`; }).join("")}</div>`}
      <button class="btn" data-act="commit" ${left!==0&&!S.onLeave?"disabled":""}>${S.onLeave?"한 해를 쉰다":left>0?`${left}칸 남았다`:"이대로 한 해를 보낸다"}</button>
      ${same&&!S.onLeave?`<button class="btn ghost" data-act="same">작년과 같이</button>`:""}</div>
      <div class="row2"><button class="btn ghost" data-act="view-resume">이력서</button><button class="btn ghost" data-act="view-log">업무 수첩</button></div>
      ${S.track==="career"&&!S.onLeave&&S.stage<6?`<button class="resign" data-act="resign">사직서를 꺼낸다</button>`:""}
      <button class="link" data-act="to-title">타이틀로 (자동 저장됨)</button>`;
  }
  function vEvent(){
    const card=cardById(S.current);
    return `${bizcard(S)}<div class="sheet"><div class="doc-head"><h2>${esc(fill(S,card.title))}</h2><span class="no">${S.age}세</span></div>
      <p>${esc(fill(S,card.text))}</p>
      ${visibleChoices(S,card).map(x=>{ const ch=x.c, lk=locked(S,ch), p=choiceChance(S,ch);
        let hint=ch.hint?fill(S,ch.hint):""; if(ch.check) hint=(hint?hint+" · ":"")+STAT[ch.check.stat]+" "+ch.check.min+" 이상이면 성공";
        if(p!=null) hint=(hint?hint+" · ":"")+(has(S,"sense")||ch.chanceFn?"성공률 "+p+"%":"운에 달렸다");
        if(lk) hint="조건 부족: "+Object.keys(ch.require).map(k=>STAT[k]+" "+ch.require[k]).join(", ");
        return `<button class="btn choice ${lk?"locked":""}" data-act="choose" data-i="${x.i}" ${lk?"disabled":""}>${esc(fill(S,ch.text))}${hint?`<small>${esc(hint)}</small>`:""}</button>`; }).join("")}</div>`;
  }
  function vResult(){
    const r=S.result;
    return `${bizcard(S)}<div class="sheet"><div class="doc-head"><h2>${esc(r.title)}</h2><span class="no">${S.age}세</span></div>
      <p>${esc(r.text)}</p>${r.shame?`<p class="small shame">업무 수첩에만 남는다: ${esc(r.shame)}</p>`:""}
      <div class="delta">${deltaChips(r.delta)}</div><button class="btn" data-act="next-event">다음</button></div>`;
  }
  function vYearEnd(){
    const m=S.summary;
    return `${bizcard(S)}<div class="sheet"><div class="doc-head"><h2>${S.age}세 연말 정산</h2><span class="no">${S.track==="founder"?"결산":"인사평가"}</span></div>
      <div class="yr-top">${m.grade?`<div class="stamp"><b>${m.grade}</b><span>성과 ${m.perf}</span></div>`:""}
        <div>${m.promo?`<p><b>${esc(m.promo)}</b> 승진. 새 명함이 나왔다.</p>`:m.grade?`<p>${{S:"올해의 주인공이었다.",A:"기대 이상이었다.",B:"할 만큼 했다.",C:"존재감이 옅었다.",D:"면담이 잡혔다."}[m.grade]}</p>`:`<p>${S.track==="school"?"한 학년이 지나갔다.":"한 해가 지나갔다."}</p>`}
        ${m.nick?`<p class="small shame">별명이 생겼다: ${esc(m.nick)}</p>`:""}</div></div>
      ${m.lines.length?`<ul class="lines">${m.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}
      ${statsTable(S)}
      <button class="btn" data-act="advance">${S.age+1>=RULES.retireAge?"정년을 맞는다":(S.age+1)+"세로"}</button></div>`;
  }
  function resumeRows(s){
    let out="", prev=null;
    for(const r of s.resume){
      if(prev!=null&&r.age-prev>=2) out+=`<tr class="gap-row"><th class="num">·</th><td>기록 없는 ${r.age-prev-1}년 <button data-act="gap" data-age="${prev+1}">수첩에서 보기</button></td></tr>`;
      out+=`<tr><th class="num">${r.age}세</th><td>${esc(r.text)}</td></tr>`; prev=r.age;
    }
    if(prev!=null&&s.age-prev>=2) out+=`<tr class="gap-row"><th class="num">·</th><td>기록 없는 ${s.age-prev}년 <button data-act="gap" data-age="${prev+1}">수첩에서 보기</button></td></tr>`;
    return out;
  }
  function vResume(){
    return `<div class="sheet"><div class="doc-head"><h2>이력서</h2><span class="no">${esc(S.name)}</span></div>
      <p class="small muted">공식 이력만 적는다. 나머지는 업무 수첩에 있다.</p>
      <table class="form">${resumeRows(S)}</table>
      <div class="doc-head" style="margin-top:8px"><h2>명함첩</h2><span class="no">${S.cards.length}장</span></div>
      <table class="form">${S.cards.map(c=>`<tr><th class="num">${c.age}세</th><td>${esc(c.title)} <span class="small muted">· ${esc(c.org)}</span></td></tr>`).join("")}</table>
      <button class="btn" data-act="back">돌아간다</button></div>`;
  }
  function vLog(){
    const by={}; for(const l of S.log){ (by[l.age]=by[l.age]||[]).push(l); }
    const ages=Object.keys(by).map(Number).sort((a,b)=>b-a);
    return `<div class="sheet"><div class="doc-head"><h2>업무 수첩</h2><span class="no">${S.log.length}줄</span></div>
      <p class="small muted">이력서에 못 쓰는 일은 <span class="shame">붉은 글씨</span>로 적혀 있다.</p>
      ${ages.length?ages.map(a=>`<div id="log-${a}"><p class="num small muted">${a}세</p><ul class="lines">${by[a].map(l=>`<li class="${l.shame?"shame":""}">${esc(l.text)}</li>`).join("")}</ul></div>`).join(""):"<p>아직 적힌 것이 없다.</p>"}
      <button class="btn" data-act="back">돌아간다</button></div>`;
  }
  function vEnding(){
    const f=S.final;
    return `<div class="sheet"><div class="doc-head"><h2>${esc(f.hidden?"숨은 엔딩 · "+f.hidden:f.title)}</h2><span class="no">${S.age}세</span></div>
      <p>${esc(f.scene)}</p><p><b>${esc(f.verdict)}</b></p>${f.hidden?`<p class="small muted">${esc(f.title)}</p>`:""}</div>
      ${bizcard(S)}
      <div class="sheet"><div class="doc-head"><h2>최종 이력서</h2><span class="no">${esc(S.name)}</span></div>
      <table class="form">${resumeRows(S)}
        <tr><th>최고 직함</th><td>${esc(S.bestTitle||titleOf(S))}</td></tr>
        <tr><th>이직</th><td class="num">${S.counters.jobChanges}회</td></tr>
        <tr><th>남은 자금</th><td class="num">${won(S.stats.money)}</td></tr></table></div>
      <div class="sheet"><div class="doc-head"><h2>이력서에 못 쓴 이야기</h2><span class="no">${f.shames.length}건</span></div>
      ${f.shames.length?`<ul class="lines">${f.shames.map(l=>`<li class="shame"><span class="num">${l.age}세</span> · ${esc(l.text)}</li>`).join("")}</ul>`:"<p>놀랍게도 없다. 수첩이 깨끗하다.</p>"}</div>
      <div class="row2"><button class="btn ghost" data-act="view-log">업무 수첩</button><button class="btn" data-act="to-title">새 판으로</button></div>`;
  }

  app.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
    const a=b.dataset.act;
    if(a==="new"){ const el=document.getElementById("nm"); nameDraft=el?el.value.trim().slice(0,8):""; S=newRun((Date.now()^(Math.random()*1e9))|0,nameDraft); drawStep=0; view="game"; }
    else if(a==="resume-run"){ S=store.get("careerhigh.run"); view="game"; draft={}; }
    else if(a==="draw-next") drawStep++;
    else if(a==="draw-done"){ beginYear(S); draft={}; save(); }
    else if(a==="inc"){ draft[b.dataset.k]=(draft[b.dataset.k]||0)+1; }
    else if(a==="dec"){ draft[b.dataset.k]=Math.max(0,(draft[b.dataset.k]||0)-1); }
    else if(a==="commit"){ commitAlloc(S,draft); draft={}; save(); }
    else if(a==="same"){ commitAlloc(S,S.lastAlloc); draft={}; save(); }
    else if(a==="choose"){ choose(S,+b.dataset.i); save(); }
    else if(a==="next-event"){ if(S.resignOpen){ S.resignOpen=false; if(S.track==="career"&&!S.queue.length){ S.phase="alloc"; S.result=null; } else if(S.track!=="career"){ S.slots=RULES.slots; S.phase="alloc"; S.result=null; } else nextEvent(S); } else nextEvent(S); if(S.final) archive(); save(); }
    else if(a==="advance"){ advance(S); draft={}; if(S.final) archive(); save(); }
    else if(a==="resign"){ S.current="resign"; S.resignOpen=true; S.phase="event"; draft={}; }
    else if(a==="view-resume"){ view="resume"; }
    else if(a==="view-log"){ view="log"; }
    else if(a==="gap"){ view="log"; const want=+b.dataset.age; const ages=S.log.map(l=>l.age).filter(x=>x>=want).sort((x,y)=>x-y); focusAge=ages.length?ages[0]:null; }
    else if(a==="back"){ view="game"; }
    else if(a==="to-title"){ if(S&&S.final) archive(); view="title"; }
    if(S&&S.final) archive();
    render();
  });
  function start(data){ if(data&&data.S){ S=data.S; view=data.view||"game"; draft=data.draft||{}; drawStep=data.drawStep||0; } render(); }
  if(window.claude&&window.claude.hot){ window.claude.hot.snapshot(()=>({S:S,view:view,draft:draft,drawStep:drawStep})); }
  if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}
</script>
</body>
</html>
